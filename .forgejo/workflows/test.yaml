name: Nix build
on: [push]
run-name: Test and build flake
jobs:
  nix-build:
    runs-on: nix
    steps:
      - name: Set HOME
        run: echo "HOME=$(dirname "$(pwd)")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - run: nix build --log-format bar-with-logs -f.
      - run: archive-nix-path haskell-taskwarrior
